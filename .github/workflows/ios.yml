# iOS release: Rust core -> staticlib -> Xcode archive -> signed IPA.
# Two jobs keep unsigned validation separate from signed distribution:
#   ios-validate (every run): Rust release builds, device/simulator
#     staging, unsigned device archive. Green means the code is shippable.
#   ios-release (tags only): downloads the validated archive, then the
#     signing-gated export (temp keychain, generated ExportOptions.plist).
#     Red here with "missing secret ..." means exactly one thing: Apple
#     signing is not configured — not a code failure.
# Signing uses CI secrets only — never commit keys or provisioning
# profiles. Must run on macOS runners.
name: iOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ios-validate:
    name: iOS Validate (unsigned archive)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust iOS libraries
        # Release policy: minimal features (no OpenCV — no iOS system
        # libraries for it; desktop-only deps are gated off iOS in
        # Cargo.toml / lib.rs). This is a build, not a check.
        run: |
          set -euo pipefail
          cargo build --lib --release --no-default-features --target aarch64-apple-ios
          cargo build --lib --release --no-default-features --target aarch64-apple-ios-sim
          cargo build --lib --release --no-default-features --target x86_64-apple-ios

      - name: Stage native artifacts
        run: |
          set -euo pipefail
          echo "=== Cargo outputs ==="
          find target/aarch64-apple-ios/release -maxdepth 1 -type f -print
          find target/aarch64-apple-ios-sim/release -maxdepth 1 -type f -print
          find target/x86_64-apple-ios/release -maxdepth 1 -type f -print
          rm -rf ios-artifacts
          mkdir -p ios-artifacts/device ios-artifacts/simulator
          cp target/aarch64-apple-ios/release/*.dylib ios-artifacts/device/ 2>/dev/null || true
          cp target/aarch64-apple-ios/release/*.a ios-artifacts/device/ 2>/dev/null || true
          cp target/aarch64-apple-ios/release/*.rlib ios-artifacts/device/ 2>/dev/null || true
          cp target/aarch64-apple-ios-sim/release/*.dylib ios-artifacts/simulator/ 2>/dev/null || true
          cp target/aarch64-apple-ios-sim/release/*.a ios-artifacts/simulator/ 2>/dev/null || true
          cp target/aarch64-apple-ios-sim/release/*.rlib ios-artifacts/simulator/ 2>/dev/null || true
          cp target/x86_64-apple-ios/release/*.dylib ios-artifacts/simulator/ 2>/dev/null || true
          cp target/x86_64-apple-ios/release/*.a ios-artifacts/simulator/ 2>/dev/null || true
          cp target/x86_64-apple-ios/release/*.rlib ios-artifacts/simulator/ 2>/dev/null || true
          echo "=== Staged ==="
          find ios-artifacts -type f -print

      - name: Generate build manifest
        run: |
          set -euo pipefail
          {
            echo "Vadadee Berry iOS Build"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Targets:"
            echo "  aarch64-apple-ios (device)"
            echo "  aarch64-apple-ios-sim (simulator)"
            echo "  x86_64-apple-ios (simulator)"
            echo
            echo "Artifacts:"
            find ios-artifacts -type f -print 2>/dev/null || true
          } > ios-artifacts/BUILD-MANIFEST.txt
          cat ios-artifacts/BUILD-MANIFEST.txt

      - name: Upload iOS Rust artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-ios-rust
          path: ios-artifacts/**
          if-no-files-found: error

      - name: Build Xcode archive (unsigned for CI validation)
        if: ${{ hashFiles('ios/**') != '' }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/VadadeeBerry.xcodeproj \
            -scheme VadadeeBerry \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VadadeeBerry.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload Xcode archive
        if: ${{ hashFiles('ios/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-ios-xcarchive
          path: build/VadadeeBerry.xcarchive
          if-no-files-found: error

      - name: Final CI report
        if: always()
        run: |
          echo "========================================"
          echo "Vadadee Berry Mobile Release"
          echo "========================================"
          echo
          echo "iOS:"
          ls build/export/*.ipa 2>/dev/null || echo "  IPA: (unsigned-archive run — signed IPA exports on tags with secrets)"
          echo
          echo "Native artifacts:"
          find ios-artifacts -type f 2>/dev/null || echo "  MISSING"
          echo
          echo "Packaging:"
          echo "  iOS Xcode archive: OK"
          echo "========================================"

  ios-release:
    name: iOS Release (signed IPA)
    needs: [ios-validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Xcode archive
        uses: actions/download-artifact@v4
        with:
          name: vadadee-berry-ios-xcarchive
          path: xcarchive-download/

      - name: Reconstruct archive bundle
        # upload-artifact stores a directory's *contents* rooted at the
        # given path, so the wrapper layout is normalized back into
        # build/VadadeeBerry.xcarchive explicitly instead of assumed.
        run: |
          set -euo pipefail
          if [ -d "build/VadadeeBerry.xcarchive" ]; then
            echo "archive bundle present"
          elif [ -f "xcarchive-download/Info.plist" ]; then
            mkdir -p build/VadadeeBerry.xcarchive
            cp -R xcarchive-download/. build/VadadeeBerry.xcarchive/
            rm -rf xcarchive-download
          elif [ -d "xcarchive-download/VadadeeBerry.xcarchive" ]; then
            mkdir -p build
            mv xcarchive-download/VadadeeBerry.xcarchive build/VadadeeBerry.xcarchive
            rm -rf xcarchive-download
          else
            echo "::error::VadadeeBerry.xcarchive not recoverable from vadadee-berry-ios-xcarchive artifact."
            find xcarchive-download build -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          test -d build/VadadeeBerry.xcarchive

      - name: Require iOS signing secrets
        # IPA export needs repo secrets. Fail here — loudly, naming each
        # secret — instead of producing an unsigned/fake release artifact.
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for v in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_PROVISIONING_PROFILE_NAME APPLE_KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing secret $v — tag releases need iOS signing secrets (repo Settings -> Secrets and variables -> Actions)."
              missing=1
            fi
          done
          test "$missing" = "0" || exit 1
          echo "signing secrets present"

      - name: Export signed IPA
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          # Temporary CI keychain (nothing persists on the runner).
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > /tmp/vadadee-cert.p12
          security import /tmp/vadadee-cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/vadadee.mobileprovision
          # ExportOptions are generated from secrets — never hard-code a
          # profile or team into the repo.
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${APPLE_EXPORT_METHOD:-app-store}</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.cosmobunny.VadadeeBerry</key>
                  <string>$APPLE_PROVISIONING_PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/VadadeeBerry.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ios/ExportOptions.plist
          ls -lah build/export/

      - name: Verify IPA
        run: |
          set -euo pipefail
          ipa="$(echo build/export/*.ipa)"
          test -f "$ipa"
          echo "=== $ipa ==="
          unzip -l "$ipa" | grep -E "Payload/VadadeeBerry.app/|Payload/VadadeeBerry.app/Info.plist"
          app="$PWD/build/export/Payload/VadadeeBerry.app"
          test -f "$app/VadadeeBerry"
          test -f "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist" | grep -qx "com.cosmobunny.VadadeeBerry"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | head -8
          echo "ipa verification OK"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-ios-ipa
          path: |
            build/export/*.ipa
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/export/*.ipa
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
