# Android release: Rust core -> native libs -> Gradle APK/AAB -> Release.
# Three jobs keep unsigned validation separate from signed distribution:
#   android-validate (every run): Rust release builds, jniLibs staging,
#     manifest, native upload. Green means the code is shippable.
#   android-release (tags only): downloads the validated natives, then
#     the signing-gated Gradle build (assembleRelease + bundleRelease),
#     verification, uploads, and Release attach. Red here with
#     "missing secret ..." means exactly one thing: Android signing is
#     not configured — not a code failure.
#   android-preview (dispatch only): assembleRelease signed with an
#     ephemeral per-run key, dex/manifest verified (real applicationId,
#     GameActivity present), published to a rolling public
#     `android-preview` GitHub Release. No secrets, no .debug suffix.
#     Uninstall the previous preview before installing the next one.
#
# Signing secrets (repo Settings -> Secrets, never committed):
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# Without them, tag release signing fails loudly instead of faking output.
name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  android-validate:
    name: Android Validate (native libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Set up Android SDK
        # packages: '' = install nothing automatically; the exact set below
        # is installed explicitly (the obsolete `tools` package no longer
        # exists upstream — sdkmanager fails on it with exit 1).
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK/NDK packages
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Configure Android linkers
        # cc-rs (used by android-activity's GameActivity C++ glue) resolves
        # CC/CXX/AR/RANLIB per target from these env vars. The NDK ships no
        # `<triple>-ar` binaries, so AR/RANLIB must point at llvm-ar /
        # llvm-ranlib explicitly — no /usr/bin symlinks.
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android35-clang"
            echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android35-clang++"

            echo "CC_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi35-clang"
            echo "CXX_armv7_linux_androideabi=$NDK_BIN/armv7a-linux-androideabi35-clang++"

            echo "CC_x86_64_linux_android=$NDK_BIN/x86_64-linux-android35-clang"
            echo "CXX_x86_64_linux_android=$NDK_BIN/x86_64-linux-android35-clang++"

            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "AR_armv7_linux_androideabi=$NDK_BIN/llvm-ar"
            echo "AR_x86_64_linux_android=$NDK_BIN/llvm-ar"

            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "RANLIB_armv7_linux_androideabi=$NDK_BIN/llvm-ranlib"
            echo "RANLIB_x86_64_linux_android=$NDK_BIN/llvm-ranlib"

            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android35-clang"
            echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$NDK_BIN/armv7a-linux-androideabi35-clang"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK_BIN/x86_64-linux-android35-clang"
          } >> "$GITHUB_ENV"
          test -x "$NDK_BIN/llvm-ar"
          test -x "$NDK_BIN/llvm-ranlib"
          test -x "$NDK_BIN/aarch64-linux-android35-clang++"
          test -x "$NDK_BIN/armv7a-linux-androideabi35-clang++"
          test -x "$NDK_BIN/x86_64-linux-android35-clang"
          echo "LLVM archiver:"
          "$NDK_BIN/llvm-ar" --version
          echo "LLVM ranlib:"
          "$NDK_BIN/llvm-ranlib" --version

      - name: Build Rust Android libraries
        # Release policy: minimal features (no OpenCV — no Android system
        # libraries for it). This is a build, not a check.
        run: |
          set -euo pipefail
          cargo build --lib --release --no-default-features --target aarch64-linux-android
          cargo build --lib --release --no-default-features --target armv7-linux-androideabi
          cargo build --lib --release --no-default-features --target x86_64-linux-android

      - name: Stage native libraries into jniLibs
        # Only the runtime .so belongs in the APK — never .rlib.
        run: |
          set -euo pipefail
          echo "=== Cargo outputs ==="
          find target/aarch64-linux-android/release -maxdepth 1 -type f -print
          find target/armv7-linux-androideabi/release -maxdepth 1 -type f -print
          find target/x86_64-linux-android/release -maxdepth 1 -type f -print
          rm -rf android/app/src/main/jniLibs android-artifacts
          mkdir -p android/app/src/main/jniLibs/arm64-v8a \
                   android/app/src/main/jniLibs/armeabi-v7a \
                   android/app/src/main/jniLibs/x86_64 \
                   android-artifacts/aarch64-linux-android \
                   android-artifacts/armv7-linux-androideabi \
                   android-artifacts/x86_64-linux-android
          cp target/aarch64-linux-android/release/libvadadee_berry.so android/app/src/main/jniLibs/arm64-v8a/
          cp target/aarch64-linux-android/release/libvadadee_berry.so android-artifacts/aarch64-linux-android/
          cp target/armv7-linux-androideabi/release/libvadadee_berry.so android/app/src/main/jniLibs/armeabi-v7a/
          cp target/armv7-linux-androideabi/release/libvadadee_berry.so android-artifacts/armv7-linux-androideabi/
          cp target/x86_64-linux-android/release/libvadadee_berry.so android/app/src/main/jniLibs/x86_64/
          cp target/x86_64-linux-android/release/libvadadee_berry.so android-artifacts/x86_64-linux-android/
          echo "=== jniLibs ==="
          find android/app/src/main/jniLibs -type f -print

      - name: Generate build manifest
        run: |
          set -euo pipefail
          {
            echo "Vadadee Berry Android Build"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Targets:"
            echo "  aarch64-linux-android -> arm64-v8a"
            echo "  armv7-linux-androideabi -> armeabi-v7a"
            echo "  x86_64-linux-android -> x86_64"
            echo
            echo "Native libraries:"
            find android/app/src/main/jniLibs -type f -print 2>/dev/null || true
            echo
            echo "APK/AAB:"
            find android -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true
            find android-release -type f -print 2>/dev/null || true
          } > android-artifacts/BUILD-MANIFEST.txt
          cat android-artifacts/BUILD-MANIFEST.txt

      - name: Upload Android native libraries (dev artifact)
        # Both trees: per-triple staging plus the jniLibs layout the
        # release job restores for Gradle (paths preserved relative to
        # the workspace root).
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android
          path: |
            android-artifacts/**
            android/app/src/main/jniLibs/**
          if-no-files-found: error

      - name: Final CI report
        if: always()
        run: |
          echo "========================================"
          echo "Vadadee Berry Mobile Release"
          echo "========================================"
          echo
          echo "Android native libraries:"
          find android/app/src/main/jniLibs -type f 2>/dev/null || echo "  MISSING"
          echo
          echo "Packaging:"
          echo "  Rust + jniLibs staging: OK"
          echo "  Gradle APK/AAB: runs in android-release (tags only)"
          echo "========================================"

  android-release:
    name: Android Release (signed APK/AAB)
    needs: [android-validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: vadadee-berry-android
          path: .

      - name: Verify staged jniLibs
        # The release build links exactly these paths; fail clearly here
        # instead of deep inside Gradle if the artifact layout ever drifts.
        run: |
          set -euo pipefail
          test -f android/app/src/main/jniLibs/arm64-v8a/libvadadee_berry.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libvadadee_berry.so
          test -f android/app/src/main/jniLibs/x86_64/libvadadee_berry.so
          find android/app/src/main/jniLibs -type f -print | sort

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Require Android signing secrets
        # Release builds always need repo secrets (Settings -> Secrets and
        # variables -> Actions). Fail here — loudly, naming each secret —
        # instead of producing an unsigned/fake release artifact. There is
        # no debug fallback: tags ship real release packages.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing secret $v — release builds need Android signing secrets (repo Settings -> Secrets and variables -> Actions)."
              missing=1
            fi
          done
          test "$missing" = "0" || exit 1
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/vadadee-release.keystore
          test -s /tmp/vadadee-release.keystore
          {
            echo "ANDROID_KEYSTORE_PATH=/tmp/vadadee-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signing secrets present"

      - name: Build release APK/AAB
        run: |
          set -euo pipefail
          echo "Android Gradle root:"
          pwd
          echo "Workspace parent:"
          realpath ..
          echo "Cargo.toml as seen by the Gradle root project:"
          realpath android/../Cargo.toml
          test -f android/../Cargo.toml
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease bundleRelease
          echo "=== APK outputs ==="
          find android/app/build/outputs/apk -type f -name '*.apk' -print | sort
          echo "=== AAB outputs ==="
          find android/app/build/outputs/bundle -type f -name '*.aab' -print | sort
          VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "Cargo version: $VER"
          mkdir -p android-release
          cp android/app/build/outputs/apk/arm64-v8a/app-arm64-v8a-release.apk "android-release/vadadee-berry-$VER-android-arm64.apk"
          cp android/app/build/outputs/apk/armeabi-v7a/app-armeabi-v7a-release.apk "android-release/vadadee-berry-$VER-android-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/x86_64/app-x86_64-release.apk "android-release/vadadee-berry-$VER-android-x86_64.apk"
          cp android/app/build/outputs/apk/universal/app-universal-release.apk "android-release/vadadee-berry-$VER-android-universal.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "android-release/vadadee-berry-$VER-android.aab"
          (cd android-release && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt) || (cd android-release && shasum -a 256 ./*.apk ./*.aab > SHA256SUMS.txt)
          ls -lah android-release/

      - name: Verify release APK/AAB
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          check_apk() {
            apk="$1"; abi="$2"
            echo "=== $apk ==="
            unzip -l "$apk" | grep -E "lib/$abi/libvadadee_berry.so|AndroidManifest.xml|classes.dex"
            "$AAPT" dump badging "$apk" | grep -o "package: name='com.cosmobunny.vadadeeberry'" | head -1
            echo "--- signature ---"
            "$APKSIGNER" verify --print-certs "$apk" 2>&1 | head -6
            if "$APKSIGNER" verify --print-certs "$apk" 2>&1 | grep -qi 'android debug'; then
              echo "::error::$apk is debug-signed, expected release signature."
              exit 1
            fi
          }
          check_apk android-release/*-android-arm64.apk arm64-v8a
          check_apk android-release/*-android-armeabi-v7a.apk armeabi-v7a
          check_apk android-release/*-android-x86_64.apk x86_64
          echo "=== universal APK (all ABIs) ==="
          unzip -l android-release/*-android-universal.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libvadadee_berry.so"
          check_apk android-release/*-android-universal.apk arm64-v8a
          echo "=== release AAB ==="
          test -f android-release/*.aab
          unzip -l android-release/*.aab | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libvadadee_berry.so|AndroidManifest.xml"
          echo "apk/aab verification OK"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android-apk
          path: |
            android-release/*.apk
            android-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android-aab
          path: |
            android-release/*.aab
            android-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-release/*.apk
            android-release/*.aab
            android-release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-preview:
    name: Android Preview (public test APK)
    needs: [android-validate]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: vadadee-berry-android
          path: .

      - name: Verify staged jniLibs
        run: |
          set -euo pipefail
          test -f android/app/src/main/jniLibs/arm64-v8a/libvadadee_berry.so
          test -f android/app/src/main/jniLibs/armeabi-v7a/libvadadee_berry.so
          test -f android/app/src/main/jniLibs/x86_64/libvadadee_berry.so
          find android/app/src/main/jniLibs -type f -print | sort

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Create ephemeral preview signing key
        # Public test builds must never touch the real release key. This
        # throwaway keystore is born and dies inside this one run: made
        # here, used once below, destroyed with the runner. No secrets,
        # nothing to leak. Price: every preview build gets a fresh
        # certificate, so uninstall the previous preview before
        # installing the next one.
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore /tmp/vadadee-preview.keystore \
            -alias vadadeepreview \
            -keyalg RSA -keysize 2048 -validity 30 \
            -storepass previewtest -keypass previewtest \
            -dname "CN=Vadadee Berry Preview,O=CosmoBunny,C=US"
          test -s /tmp/vadadee-preview.keystore
          {
            echo "ANDROID_KEYSTORE_PATH=/tmp/vadadee-preview.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=previewtest"
            echo "ANDROID_KEY_ALIAS=vadadeepreview"
            echo "ANDROID_KEY_PASSWORD=previewtest"
          } >> "$GITHUB_ENV"
          echo "ephemeral preview key created (single-run use)"

      - name: Build preview APK
        # assembleRelease: real applicationId, no .debug suffix (that
        # suffix lives only in the debug buildType, which never runs
        # here). Signed with the ephemeral key above.
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease
          echo "=== APK outputs ==="
          find android/app/build/outputs/apk -type f -name '*.apk' -print | sort
          VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          echo "Cargo version: $VER"
          mkdir -p android-preview
          cp android/app/build/outputs/apk/arm64-v8a/app-arm64-v8a-release.apk "android-preview/vadadee-berry-$VER-android-preview-arm64.apk"
          cp android/app/build/outputs/apk/armeabi-v7a/app-armeabi-v7a-release.apk "android-preview/vadadee-berry-$VER-android-preview-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/x86_64/app-x86_64-release.apk "android-preview/vadadee-berry-$VER-android-preview-x86_64.apk"
          cp android/app/build/outputs/apk/universal/app-universal-release.apk "android-preview/vadadee-berry-$VER-android-preview-universal.apk"
          (cd android-preview && sha256sum ./*.apk > SHA256SUMS.txt) || (cd android-preview && shasum -a 256 ./*.apk > SHA256SUMS.txt)
          ls -lah android-preview/

      - name: Verify preview APK
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          fail=0
          for apk in android-preview/*-preview-*.apk; do
            echo "=== $apk ==="
            "$AAPT" dump badging "$apk" > /tmp/badging.txt
            grep "package:" /tmp/badging.txt
            if ! grep -q "package: name='com.cosmobunny.vadadeeberry'" /tmp/badging.txt; then
              echo "::error::$apk has wrong package id (expected com.cosmobunny.vadadeeberry)."
              fail=1
            fi
            if grep -q '\.debug' /tmp/badging.txt; then
              echo "::error::$apk contains a .debug id — refusing to publish."
              fail=1
            fi
          done
          test "$fail" = "0"
          echo "=== GameActivity dex gate (the Sep-26 defect must never ship again) ==="
          DEXCOUNT=$(unzip -p android-preview/*-preview-universal.apk 'classes*.dex' | strings | grep -c -F 'Lcom/google/androidgamesdk/GameActivity;' || true)
          echo "GameActivity class refs in dex: $DEXCOUNT"
          if [ "$DEXCOUNT" = "0" ]; then
            echo "::error::GameActivity missing from classes.dex — broken APK, refusing to publish."
            exit 1
          fi
          echo "=== native libs ==="
          unzip -l android-preview/*-preview-universal.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libvadadee_berry.so"
          echo "preview verification OK"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android-preview
          path: |
            android-preview/*.apk
            android-preview/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to rolling preview release
        # Public download: one rolling `android-preview` GitHub Release,
        # overwritten on every dispatch. No secrets involved.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: Android Preview (public test build)
          body: |
            Public test APK for Vadadee Berry (phone testing, not Play).
            Package: com.cosmobunny.vadadeeberry — no .debug suffix.
            Signed with an ephemeral per-build certificate: uninstall any
            previous preview before installing this one.
          files: |
            android-preview/*.apk
            android-preview/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
