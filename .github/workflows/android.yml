# Android build: Rust core (Android targets) + Gradle APK/AAB.
# Separate pipeline from desktop release (§31): mobile signing problems must
# never block desktop artifacts. Artifacts are named vadadee-berry-android-*,
# never placed under release/*.tar.gz|zip.
name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  android-check:
    name: Rust Android targets (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Check library for Android targets
        run: |
          cargo check --lib --target aarch64-linux-android
          cargo check --lib --target armv7-linux-androideabi
          cargo check --lib --target x86_64-linux-android

  android-package:
    name: Gradle APK/AAB
    runs-on: ubuntu-latest
    needs: android-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          test -d android || { echo "android/ project missing — packaging lands here in Phase 7"; exit 1; }
          ./gradlew -p android assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
