# Android build: Rust core (Android targets) + Gradle APK/AAB.
# Separate pipeline from desktop release (§31): mobile signing problems must
# never block desktop artifacts. Artifacts are named vadadee-berry-android-*,
# never placed under release/*.tar.gz|zip.
name: Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  android-check:
    name: Rust Android targets (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK (C++ toolchain for cc-rs build scripts)
        # setup-android alone does NOT install the NDK. Without it, crates
        # with C++ build scripts (e.g. android-activity via cc-rs) fail with:
        #   failed to find tool "aarch64-linux-android-clang++"
        # cc-rs discovers the toolchain from ANDROID_NDK_HOME.
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.0.12077973"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Check library for Android targets
        # Minimal feature set: OpenCV (default feature) has no Android/iOS
        # system libraries — mobile never ships it (matches release policy).
        run: |
          cargo check --lib --no-default-features --target aarch64-linux-android
          cargo check --lib --no-default-features --target armv7-linux-androideabi
          cargo check --lib --no-default-features --target x86_64-linux-android

  android-package:
    name: Gradle APK/AAB
    runs-on: ubuntu-latest
    needs: android-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK (Gradle native builds need it too)
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.0.12077973"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        # Packaging runs only once the Gradle host exists. Until then the
        # Rust check above is the Android milestone — skip loudly instead
        # of failing the tag.
        run: |
          if [ ! -d android ]; then
            echo "NOTICE: no android/ Gradle host project yet — skipping packaging (check job above is the milestone)."
            exit 0
          fi
          ./gradlew -p android assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-android-debug-apk
          path: android/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
