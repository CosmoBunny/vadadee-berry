# Build desktop release binaries, bundle them, and publish downloadable archives.
# Artifacts land under release/ (via packaging/make_desktop_release.sh) and are
# uploaded for download. On version tags (v*), they are attached to a GitHub Release.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      bins:
        description: "Which binaries to ship"
        type: choice
        options:
          - all
          - studio
          - mcp
        default: all
      with_opencv:
        description: "Enable OpenCV feature (slower; needs system OpenCV)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev alone is not enough for bindgen: the shared lib lives under
          # /usr/lib/llvm-*/lib and must be pointed at via LIBCLANG_PATH (pipewire/libspa-sys).
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            clang \
            libclang-dev \
            llvm-dev
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends libopencv-dev
          fi
          # Prefer llvm-config; fall back to the usual Ubuntu path.
          if command -v llvm-config >/dev/null 2>&1; then
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
          elif [ -d /usr/lib/llvm-14/lib ]; then
            echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
          else
            # last resort: first libclang.so* we can find
            CLANG_SO="$(find /usr/lib -name 'libclang.so*' 2>/dev/null | head -1 || true)"
            if [ -n "$CLANG_SO" ]; then
              echo "LIBCLANG_PATH=$(dirname "$CLANG_SO")" >> "$GITHUB_ENV"
            fi
          fi
          echo "LIBCLANG_PATH will be: ${LIBCLANG_PATH:-'(set in GITHUB_ENV for next steps)'}"
          # Show what we wrote (next steps pick it up from GITHUB_ENV)
          grep LIBCLANG_PATH "$GITHUB_ENV" || true

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: |
          # Xcode CLT is preinstalled on GitHub runners.
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            brew install opencv llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Resolve build flags
        id: flags
        shell: bash
        run: |
          BINS="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BINS="${{ inputs.bins }}"
          fi
          echo "bins=$BINS" >> "$GITHUB_OUTPUT"

          WITH_OPENCV="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_opencv }}" = "true" ]; then
            WITH_OPENCV="true"
          fi
          echo "with_opencv=$WITH_OPENCV" >> "$GITHUB_OUTPUT"

      - name: Build, bundle, copy to release/
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/make_desktop_release.sh
          EXTRA=()
          if [ "${{ steps.flags.outputs.with_opencv }}" != "true" ]; then
            EXTRA+=(--no-default-features)
          fi
          ./packaging/make_desktop_release.sh --bins "${{ steps.flags.outputs.bins }}" "${EXTRA[@]+"${EXTRA[@]}"}"
          echo "---- release/ ----"
          ls -lah release/

      - name: Upload release archives (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

  # Attach packaged archives to a GitHub Release so users can download them.
  publish:
    name: Publish GitHub Release assets
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vadadee-berry-desktop-*
          merge-multiple: true

      - name: List downloadable files
        run: find artifacts -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
