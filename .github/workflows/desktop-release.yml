# Build desktop release binaries, bundle them, and publish downloadable archives.
# Artifacts land under release/ (via packaging/make_desktop_release.sh) and are
# uploaded for download. On version tags (v*), they are attached to a GitHub Release.
#
# Dependency graph (build → package everything → validate → upload once;
# exactly one uniquely-named artifact per matrix leg — upload-artifact
# returns 409 Conflict if a name is created twice in one run):
#   cargo build --release --no-default-features
#     ├── Linux: tar.gz + AppImage + .deb + Flatpak → vadadee-berry-linux-<arch>
#     ├── Windows: zip + -setup.exe (WiX consumes the built .exe) → vadadee-berry-windows-<arch>
#     └── macOS: tar.gz + .dmg (.app first, then image) → vadadee-berry-macos-<arch>
# A packaging failure uploads only the run-scoped diagnostics artifact.
# Mobile (Android APK / iOS archive) lives in android.yml / ios.yml and is
# validation-only: publish below intentionally attaches desktop artifacts.
#
# Release policy (explicit — see Cargo.toml [features], default = ["opencv"]):
# official tag releases intentionally use the MINIMAL feature set
# (--no-default-features, no OpenCV). OpenCV builds are opt-in via manual
# dispatch only, where the runner actually provisions system OpenCV.
# Do not assume v1.x artifacts contain the default feature build.
#
# IMPORTANT: "Re-run failed jobs" reuses the same commit. After workflow fixes,
# start a NEW run (Actions → Desktop release → Run workflow) on latest main.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      bins:
        description: "Which binaries to ship"
        type: choice
        options:
          - all
          - studio
          - mcp
        default: all
      with_opencv:
        description: "Enable OpenCV feature (slower; needs system OpenCV; Linux/macOS CI only — Windows always builds minimal)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04: PipeWire/SPA headers new enough for pipewire-rs 0.8 / libspa 0.8.
          # (22.04's SPA lacks spa_video_info_raw.flags → libspa fails to compile.)
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          # Noble: clang/llvm default to 18; pipewire 1.x headers match pipewire-rs 0.8.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            clang \
            libclang-dev \
            llvm-dev
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends libopencv-dev
          fi

          # Resolve libclang for bindgen (pipewire → libspa-sys).
          if command -v llvm-config >/dev/null 2>&1; then
            LIBCLANG_PATH="$(llvm-config --libdir)"
          else
            LIBCLANG_PATH="$(find /usr/lib -type d -path '*/llvm-*/lib' 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "${LIBCLANG_PATH:-}" ] || [ ! -d "$LIBCLANG_PATH" ]; then
            echo "ERROR: could not locate LLVM libdir for LIBCLANG_PATH"
            find /usr/lib -name 'libclang.so*' 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          ls -la "$LIBCLANG_PATH"/libclang* || true
          # bindgen often wants an unversioned libclang.so
          if [ ! -e "$LIBCLANG_PATH/libclang.so" ]; then
            SO="$(ls "$LIBCLANG_PATH"/libclang.so.* 2>/dev/null | head -1 || true)"
            if [ -n "$SO" ]; then
              sudo ln -sfn "$(basename "$SO")" "$LIBCLANG_PATH/libclang.so"
            fi
          fi
          test -e "$LIBCLANG_PATH/libclang.so" -o -e "$LIBCLANG_PATH/libclang.so.1" \
            || { echo "ERROR: libclang shared library still missing"; exit 1; }
          pkg-config --modversion libspa-0.2
          pkg-config --modversion libpipewire-0.3

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            # Pinned OpenCV 4.x via the versioned formula (tracks 4.x,
            # currently 4.14.0): unversioned `opencv` is 5.x, which the
            # opencv Rust crate (0.93.7) rejects (needs 3.2/3.4/4.x).
            # opencv@4 is keg-only, so its pkg-config/CMake paths are
            # exposed explicitly for the crate's build script.
            brew install opencv@4 llvm pkg-config cmake
            OCV_PREFIX="$(brew --prefix opencv@4)"
            echo "OpenCV 4 prefix: $OCV_PREFIX"
            PKG_CONFIG_PATH="$OCV_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export PKG_CONFIG_PATH
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
            echo "OpenCV_DIR=$OCV_PREFIX/lib/cmake/opencv4" >> "$GITHUB_ENV"
            echo "---- OpenCV diagnostics ----"
            brew --prefix opencv@4
            pkg-config --modversion opencv4
            pkg-config --cflags opencv4
            pkg-config --libs opencv4
            test "$(pkg-config --modversion opencv4 | cut -d. -f1)" = "4" \
              || { echo "ERROR: expected OpenCV 4.x"; exit 1; }
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Resolve build flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          BINS="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BINS="${{ inputs.bins }}"
          fi
          echo "bins=$BINS" >> "$GITHUB_OUTPUT"

          # Trigger → feature matrix (explicit):
          #   manual dispatch, checkbox false → minimal (--no-default-features, all)
          #   manual dispatch, checkbox true  → Linux/macOS: OpenCV;
          #                                    Windows: minimal + warning
          #   tag push v*                     → minimal (--no-default-features, all)
          REQUESTED_OPENCV="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_opencv }}" = "true" ]; then
            REQUESTED_OPENCV="true"
          fi
          # Effective mode is per platform: Windows CI has no OpenCV
          # environment, so it always builds minimal (warn, never fail —
          # a global checkbox must not red the Windows leg).
          EFFECTIVE_OPENCV="false"
          if [ "$REQUESTED_OPENCV" = "true" ]; then
            if [ "${{ runner.os }}" = "Linux" ] || [ "${{ runner.os }}" = "macOS" ]; then
              EFFECTIVE_OPENCV="true"
            fi
          fi
          if [ "$REQUESTED_OPENCV" = "true" ] && [ "${{ runner.os }}" = "Windows" ]; then
            echo "WARNING: OpenCV is not supported by the Windows CI environment yet."
            echo "Building Windows release without OpenCV."
          fi
          echo "with_opencv=$EFFECTIVE_OPENCV" >> "$GITHUB_OUTPUT"

      - name: Build, bundle, copy to release/
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ runner.os }}" = "Linux" ]; then
            # From Install Linux system deps (GITHUB_ENV).
            if [ -z "${LIBCLANG_PATH:-}" ]; then
              LIBCLANG_PATH="$(llvm-config --libdir 2>/dev/null || true)"
            fi
            export LIBCLANG_PATH
            echo "LIBCLANG_PATH=${LIBCLANG_PATH:-unset}"
            test -n "${LIBCLANG_PATH:-}" || { echo "ERROR: LIBCLANG_PATH empty"; exit 1; }
          fi

          chmod +x packaging/make_desktop_release.sh
          EXTRA=()
          if [ "${{ steps.flags.outputs.with_opencv }}" != "true" ]; then
            EXTRA+=(--no-default-features)
          fi
          if [ ${#EXTRA[@]} -gt 0 ]; then
            ./packaging/make_desktop_release.sh --bins "${{ steps.flags.outputs.bins }}" "${EXTRA[@]}"
          else
            ./packaging/make_desktop_release.sh --bins "${{ steps.flags.outputs.bins }}"
          fi
          echo "---- release/ ----"
          ls -lah release/

      # Linux distribution formats live here — never in the shared dependency
      # block above, and never expected from Windows/macOS jobs.
      - name: Install Flatpak tooling (Linux only)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder desktop-file-utils appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          chmod +x packaging/linux/appimage/build_appimage.sh
          ./packaging/linux/appimage/build_appimage.sh
          ls -lah release/*.AppImage

      - name: Build Linux Flatpak bundle
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          chmod +x packaging/flatpak/build_flatpak.sh
          ./packaging/flatpak/build_flatpak.sh
          ls -lah release/*.flatpak

      - name: Build Linux .deb
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh
          ls -lah release/*.deb

      - name: Install-test Linux .deb
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo dpkg -i release/vadadee-berry_*.deb || sudo apt-get install -f -y
          test -x /usr/bin/vadadee-berry
          missing="$(ldd /usr/bin/vadadee-berry | grep 'not found' || true)"
          test -z "$missing" || { echo "ERROR: missing runtime libs:$missing"; exit 1; }
          echo "deb install-test OK"

      - name: Validate Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.flatpak' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.deb' -print -quit)"
          echo "linux artifacts present"

      - name: Upload Linux release artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-linux-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.AppImage
            release/*.flatpak
            release/*.deb
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          .\packaging\windows\build_installer.ps1
          Get-ChildItem release\*-setup.exe

      - name: Validate Windows artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem release\*-setup.exe -ErrorAction SilentlyContinue)) {
              throw "WiX Burn bundle (-setup.exe) was not produced"
          }
          if (-not (Get-ChildItem release\*.msi -ErrorAction SilentlyContinue)) {
              throw "WiX MSI was not produced"
          }

      - name: Upload Windows release artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-windows-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.msi
            release/*-setup.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          chmod +x packaging/macos/make_macos_installer.sh
          ./packaging/macos/make_macos_installer.sh --arch aarch64 --bin-dir target/release
          ls -lah release/*.dmg

      - name: Validate macOS artifacts
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          test -n "$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          echo "macos artifacts present"

      - name: Upload macOS release artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-macos-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaging failure diagnostics
        # Unique per run (run_id) so it never collides; runs only on failure.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-packaging-failure-${{ matrix.platform }}-${{ runner.arch }}-${{ github.run_id }}
          path: |
            release/
            dist/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    # Desktop artifacts only. Mobile outputs (Android debug APK, iOS
    # unsigned archive) are validation-only and intentionally NOT published:
    # they are unsigned CI checkpoints, not shippable releases.
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vadadee-berry-*
          merge-multiple: true

      - name: List downloadable files
        run: find artifacts -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.flatpak
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*-setup.exe
            artifacts/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
