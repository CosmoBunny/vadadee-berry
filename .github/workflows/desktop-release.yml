# Build desktop release binaries, bundle them, and publish downloadable archives.
# Artifacts land under release/ (via packaging/make_desktop_release.sh) and are
# uploaded for download. On version tags (v*), they are attached to a GitHub Release.
#
# IMPORTANT: "Re-run failed jobs" reuses the same commit. After workflow fixes,
# start a NEW run (Actions → Desktop release → Run workflow) on latest main.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      bins:
        description: "Which binaries to ship"
        type: choice
        options:
          - all
          - studio
          - mcp
        default: all
      with_opencv:
        description: "Enable OpenCV feature (slower; needs system OpenCV)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 ships LLVM 14; pipewire's libspa-sys needs bindgen + libclang.
          - os: ubuntu-22.04
            platform: linux
            libclang_path: /usr/lib/llvm-14/lib
          - os: windows-latest
            platform: windows
            libclang_path: ""
          - os: macos-14
            platform: macos
            libclang_path: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            clang-14 \
            libclang-14-dev \
            libclang1-14 \
            llvm-14 \
            llvm-14-dev
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends libopencv-dev
          fi

          # Prove libclang is on disk where we expect it (bindgen / libspa-sys).
          echo "=== libclang search ==="
          ls -la /usr/lib/llvm-14/lib/libclang* || true
          find /usr/lib -name 'libclang.so*' 2>/dev/null | head -20 || true
          test -e /usr/lib/llvm-14/lib/libclang.so.1 \
            || test -e /usr/lib/llvm-14/lib/libclang.so \
            || { echo "ERROR: libclang shared library missing under /usr/lib/llvm-14/lib"; exit 1; }

      - name: Install macOS system deps
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.with_opencv || false }}" = "true" ]; then
            brew install opencv llvm
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-release-${{ matrix.platform }}
          cache-on-failure: true

      - name: Resolve build flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          BINS="all"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BINS="${{ inputs.bins }}"
          fi
          echo "bins=$BINS" >> "$GITHUB_OUTPUT"

          WITH_OPENCV="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.with_opencv }}" = "true" ]; then
            WITH_OPENCV="true"
          fi
          echo "with_opencv=$WITH_OPENCV" >> "$GITHUB_OUTPUT"

      - name: Build, bundle, copy to release/
        shell: bash
        env:
          # Set here (not only GITHUB_ENV) so cargo/bindgen always see it on Linux.
          LIBCLANG_PATH: ${{ matrix.libclang_path }}
        run: |
          set -euo pipefail

          if [ "${{ runner.os }}" = "Linux" ]; then
            # Empty matrix value would clear LIBCLANG_PATH; force known path.
            export LIBCLANG_PATH="${LIBCLANG_PATH:-/usr/lib/llvm-14/lib}"
            echo "LIBCLANG_PATH=$LIBCLANG_PATH"
            ls -la "$LIBCLANG_PATH"/libclang* || true
            # Some bindgen versions want a plain libclang.so symlink.
            if [ ! -e "$LIBCLANG_PATH/libclang.so" ] && [ -e "$LIBCLANG_PATH/libclang.so.1" ]; then
              sudo ln -sf libclang.so.1 "$LIBCLANG_PATH/libclang.so"
            fi
            # Also export for any nested process that only reads GITHUB_ENV-style vars.
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          fi

          chmod +x packaging/make_desktop_release.sh
          EXTRA=()
          if [ "${{ steps.flags.outputs.with_opencv }}" != "true" ]; then
            EXTRA+=(--no-default-features)
          fi
          # Expand EXTRA safely under set -u when empty.
          if [ ${#EXTRA[@]} -gt 0 ]; then
            ./packaging/make_desktop_release.sh --bins "${{ steps.flags.outputs.bins }}" "${EXTRA[@]}"
          else
            ./packaging/make_desktop_release.sh --bins "${{ steps.flags.outputs.bins }}"
          fi
          echo "---- release/ ----"
          ls -lah release/

      - name: Upload release archives (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vadadee-berry-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release assets
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vadadee-berry-desktop-*
          merge-multiple: true

      - name: List downloadable files
        run: find artifacts -type f | sort

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
